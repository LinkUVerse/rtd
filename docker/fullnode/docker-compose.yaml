---
version: "3.9"
services:
  fullnode:
    # Build docker/rtd-node/Dockerfile from this checkout and set RTD_NODE_IMAGE.
    image: ${RTD_NODE_IMAGE:?Set RTD_NODE_IMAGE to an RTD image built from this checkout}
    ports:
    - "8080:8080"
    - "8084:8084/udp"
    - "9000:9000"
    - "9184:9184"
    volumes:
    - ./fullnode-template.yaml:/opt/rtd/config/fullnode.yaml:ro
    - ./genesis.blob:/opt/rtd/config/genesis.blob:ro
    - ./rtddb:/opt/rtd/db:rw
    command: ["/opt/rtd/bin/rtd-node", "--config-path", "/opt/rtd/config/fullnode.yaml"]
volumes:
  rtddb:
