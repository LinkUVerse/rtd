name: Trigger pre-build images for Rtd commits

on:
  workflow_dispatch:
  push:
    branches: 
      - 'main'
      - 'devnet'
      - 'testnet'
      - 'mainnet'
      - 'releases/rtd-*-release'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  prebuild-rtd-images:
    if: ${{ vars.RTD_OPERATIONS_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Pre-build Images in configured operations repository
        if: ${{ vars.RTD_OPERATIONS_REPOSITORY != '' }}
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # pin@v4.0.1
        with: 
          repository: ${{ vars.RTD_OPERATIONS_REPOSITORY }}
          token: ${{ secrets.DOCKER_BINARY_BUILDS_DISPATCH }}
          event-type: prebuild-rtd-images
          client-payload: >
            {
              "rtd_commit": "${{ github.sha }}",
              "cache_family": "${{ github.ref_name }}",
              "caller_name": "rtd_repo_${{ github.ref_name }}",
              "push_to_dockerhub": "true",
              "build_arm64": "${{ github.ref_name == 'devnet' || github.ref_name == 'testnet' || github.ref_name == 'mainnet' }}",
              "graphql_rpc": "true",
              "indexer_alt": "true",
              "stress": "true",
              "kvstore": "true"
            }
