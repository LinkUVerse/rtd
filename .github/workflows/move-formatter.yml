# Checks formatting in all examples and system packages (TBD for Rtd System and Bridge)
# The npm formatter check runs only after an RTD package and version are configured.
name: Move Tooling

on:
  push:
    branches: main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  tree-sitter:
    name: Tree Sitter - run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: external-crates/move/tooling/tree-sitter
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
      - name: Install tree-sitter-cli
        run: cargo install tree-sitter-cli
      - run: ./run-tests.sh

  prettier-move-tests:
    name: Move Formatter - run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
      - name: Install tree-sitter-cli
        run: cargo install tree-sitter-cli
      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # pin@v6.2.0
        # build the tree-sitter-move.wasm file and copy it to the prettier-move directory
      - run: tree-sitter build --wasm; cp tree-sitter-move.wasm ./../prettier-move/tree-sitter-move.wasm
        working-directory: external-crates/move/tooling/tree-sitter
        # install the dependencies and run the tests
      - run: npm i; npm test
        working-directory: external-crates/move/tooling/prettier-move

  prettier-move:
    name: Move Formatter - check formatting
    if: ${{ vars.RTD_PRETTIER_MOVE_NPM_PACKAGE != '' && vars.RTD_PRETTIER_MOVE_NPM_VERSION != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - examples # run on all examples
          - crates/rtd-framework/packages/rtd-framework # rtd framework
          - crates/rtd-framework/packages/move-stdlib # move stdlib
          - crates/rtd-framework/packages/rtd-system # rtd system
          - crates/rtd-framework/packages/bridge # bridge
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # pin@v6.2.0
      - run: npm install --no-warnings "${RTD_PRETTIER_MOVE_NPM_PACKAGE}@${RTD_PRETTIER_MOVE_NPM_VERSION}"
        env:
          RTD_PRETTIER_MOVE_NPM_PACKAGE: ${{ vars.RTD_PRETTIER_MOVE_NPM_PACKAGE }}
          RTD_PRETTIER_MOVE_NPM_VERSION: ${{ vars.RTD_PRETTIER_MOVE_NPM_VERSION }}
      - run: npx prettier-move -c **/*.move
