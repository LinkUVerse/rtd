---
- name: Require an explicit verified Rtd node artifact
  ansible.builtin.assert:
    that:
      - (rtd_node_binary_url | default('')) is match('^https://[^/]+/.+')
      - (rtd_node_binary_sha256 | default('')) is match('^[0-9a-fA-F]{64}$')
    fail_msg: "Set rtd_node_binary_url to a trusted HTTPS artifact URL and rtd_node_binary_sha256 to its verified SHA-256 digest. RTD has no default public release endpoint."

- name: Install required system packages
  apt: name={{ item }} state=latest update_cache=yes
  loop: [
    'iptables-persistent'
  ]

- name: Include Ubuntu tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/ubuntu.yaml"
  when: ansible_distribution == 'Ubuntu'

- name: Include iptables tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/iptables.yaml"
  when: skip_iptables == false

- name: Include monitoring tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/monitoring.yaml"
  when: skip_monitoring == false

- name: Include Rtd tasks
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/rtd.yaml"
