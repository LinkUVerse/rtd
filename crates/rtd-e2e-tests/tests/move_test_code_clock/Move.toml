# Separate from `move_test_code` because `clock::borrow` only exists in the
# protocol 139 framework, and some tests publish `move_test_code` on older frameworks.
[package]
name = "move_test_code_clock"
version = "0.0.1"
edition = "2024.beta"

[dependencies]
Rtd = { local = "../../../rtd-framework/packages/rtd-framework" }

[addresses]
move_test_code_clock = "0x0"
