[package]
name = "rtd-kvstore"
authors = ["LinkU Labs"]
license = "Apache-2.0"
publish = false
edition = "2024"
version.workspace = true

[lints]
workspace = true

[features]
# Exposes the in-memory mock BigTable server (`testing::MockBigtableServer`)
# for cross-crate read/write-path tests without pulling it into normal builds.
testing = ["dep:tokio-stream"]

[dependencies]
anyhow.workspace = true
arc-swap.workspace = true
async-stream.workspace = true
bytes.workspace = true
async-trait.workspace = true
backoff.workspace = true
base64.workspace = true
bcs.workspace = true
clap.workspace = true
futures.workspace = true
governor.workspace = true
http.workspace = true
gcp_auth.workspace = true
integer-encoding.workspace = true
linku-common.workspace = true
num_cpus.workspace = true
prometheus.workspace = true
rand.workspace = true
prost.workspace = true
prost-types.workspace = true
roaring.workspace = true
rustc-hash.workspace = true
rustls.workspace = true
scoped-futures.workspace = true
serde.workspace = true
toml.workspace = true
rtd-futures.workspace = true
rtd-inverted-index.workspace = true
rtd-indexer-alt-framework.workspace = true
rtd-indexer-alt-framework-store-traits.workspace = true
rtd-indexer-alt-metrics.workspace = true
rtd-protocol-config.workspace = true
rtd-types.workspace = true
telemetry-subscribers.workspace = true
tokio = { workspace = true, features = ["full"] }
tonic = { workspace = true, features = ["transport"] }
tonic-prost.workspace = true
tokio-stream = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
move-core-types.workspace = true
rtd-indexer-alt-framework = { workspace = true, features = ["cluster"] }
rtd-indexer-alt-framework-store-traits = { workspace = true, features = ["testing"] }
rtd-keys.workspace = true
rtd-rpc.workspace = true
rtd-test-transaction-builder.workspace = true
test-cluster.workspace = true
tokio-stream.workspace = true
url.workspace = true
