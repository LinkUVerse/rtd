[package]
name = "rtd-indexer-alt-framework"
version.workspace = true
authors = ["LinkU Labs <build@linkuverse.com>"]
license = "Apache-2.0"
publish = false
edition = "2024"

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
backoff.workspace = true
bytes.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["env"] }
diesel = { workspace = true, features = ["chrono"], optional = true }
diesel-async = { workspace = true, features = ["bb8", "postgres", "async-connection-wrapper"], optional = true }
diesel_migrations = { workspace = true, optional = true }
futures.workspace = true
http.workspace = true
rtd-http.workspace = true
num_cpus.workspace = true
prometheus.workspace = true
object_store.workspace = true
reqwest.workspace = true
serde_json.workspace = true
rand.workspace = true
scoped-futures.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tonic.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
url.workspace = true

rtd-field-count.workspace = true
rtd-futures.workspace = true
rtd-indexer-alt-framework-store-traits.workspace = true
rtd-indexer-alt-metrics.workspace = true
rtd-rpc.workspace = true
rtd-types.workspace = true
prost.workspace = true
prost-types.workspace = true
zstd.workspace = true

rtd-pg-db = { workspace = true, optional = true }

[dev-dependencies]
telemetry-subscribers.workspace = true
wiremock.workspace = true
dashmap.workspace = true

rtd-indexer-alt-framework-store-traits = { workspace = true, features = ["testing"] }
rtd-synthetic-ingestion.workspace = true

[features]
default = ["cluster"]
cluster = ["dep:tracing-subscriber", "postgres"]
postgres = [
    "dep:rtd-pg-db",
    "dep:diesel",
    "dep:diesel-async",
    "dep:diesel_migrations",
]
