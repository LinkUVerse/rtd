[package]
name = "rtd-bridge-indexer"
version = "0.1.0"
authors = ["LinkU Labs"]
license = "Apache-2.0"
publish = false
edition = "2024"

[lints]
workspace = true

[dependencies]
alloy = { version = "1.1.3", features = ["rand", "sol-types", "json-rpc", "provider-ws"] }
serde.workspace = true
tap.workspace = true
diesel = { workspace = true, features = ["serde_json"] }
diesel-async = { workspace = true, features = ["bb8", "postgres"] }
tokio = { workspace = true, features = ["full"] }
anyhow.workspace = true
futures.workspace = true
async-trait.workspace = true
clap.workspace = true
linku-metrics.workspace = true
prometheus.workspace = true
serde_json.workspace = true
rtd-bridge.workspace = true
rtd-bridge-schema.workspace = true
rtd-types.workspace = true
telemetry-subscribers.workspace = true
tracing.workspace = true
backoff.workspace = true
rtd-config.workspace = true
rustls.workspace = true

[dev-dependencies]
rtd-test-transaction-builder.workspace = true
test-cluster.workspace = true
hex-literal = "0.3.4"
diesel_migrations = "2.2.0"
rtd-bridge = { workspace = true, features = ["test-utils"] }

[[bin]]
name = "bridge-indexer"
path = "src/main.rs"
